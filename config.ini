# 注意这是乘法：填 6 个端口，探测点数就是 IP 数的 6 倍。
# 建议先 "443"，确认跑通后再按需加。
# 留空字符串表示不限制（列表源里是什么端口就测什么）。
PORTS = "443"

# 额外指定哪些端口按【明文 HTTP】测。
# CF 的两类端口脚本已经内置识别，不用写：
#   HTTPS: 443 2053 2083 2087 2096 8443
#   HTTP : 80 8080 8880 2052 2082 2086 2095
# 只有非标端口（比如 25565 其实跑的是 HTTP）才需要写在这里。
HTTP_PORTS = ""

# 断点续跑：把「哪些 ASN 已扫完」记到 output/scan_state.json。
# vps 档位全量要 12 小时，中途重启会从这里接着扫，不用从头来。
# 配置变了（档位/全量/端口/ASN 列表不同）会自动当新一轮重扫。
# 想强制从头扫：删掉 output/scan_state.json 和 output/stage1.csv.new
RESUME = true

# ==================== 推送通知（每轮结束推到手机） ====================
# 渠道（详见 notify.py -list）：
#   bark        iOS，target = https://api.day.app/你的key
#   pushdeer    开源 iOS/Android，target = https://api2.pushdeer.com
#   ntfy        开源全平台/可自建，target = https://ntfy.sh/你的topic
#   serverchan  Server酱³（微信），target = https://sctapi.ftqq.com/你的key.send
#   telegram    target = <bot_token>|<chat_id>
#   wecom / dingtalk / feishu   群机器人 webhook 完整地址
#   webhook     通用 POST JSON
#
# 配好后先测一下：python notify.py -channel bark -target https://api.day.app/xxx
NOTIFY_CHANNEL = ""
NOTIFY_TARGET = ""
NOTIFY_TIMEOUT = 15
# 没有可用 IP 时是否也推（true = 不推，免得白刷屏）
NOTIFY_ONLY_WITH_RESULT = true

