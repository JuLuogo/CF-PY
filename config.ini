# ==================== 性能 ====================
# 可用性检查用哪种实现。
#
# USE_NATIVE_SOCKET：用 Python 原生 socket 代替 fork curl 子进程。
#   18 万个 IP 就是 18 万次进程创建，实测单核 VPS 上进程创建速率 19 个/秒，
#   同时挂着 60 个 curl 进程。换成原生 socket 后没有进程创建。
#   （多核机器上实测提速不明显，因为瓶颈是网络 RTT；但省掉了进程开销。）
USE_NATIVE_SOCKET = true

# USE_ASYNCIO：第一阶段用 asyncio 单线程事件循环代替线程池。
#   线程池版每个在飞的请求占一个 OS 线程。1 核 VPS 上开几百个线程，
#   内核光做上下文切换就忙不过来。
#   asyncio 是单线程事件循环，几百个并发连接也只是几百个 socket，
#   没有线程栈、没有上下文切换 —— 单核上这是数量级的差别。
#   多核机器上两者差不多（实测都是 ~230 个/秒，瓶颈在网络 RTT）。
USE_ASYNCIO = true

# asyncio 并发数。单核建议 200~500。
# 注意：调太高不会更快，反而可能因为本机端口/连接跟踪表耗尽而丢命中。
ASYNCIO_CONCURRENCY = 300

# 流式第一阶段的批大小。峰值内存只跟这个值有关（约 20000 个候选 = 5MB）。
# 调小更省内存，调大吞吐略高。20000 是 1 核小内存 VPS 上的平衡点。
CHUNK_SIZE = 20000

# 逐 ASN 流水线里每个子批的大小。峰值内存 ≈ 这个数 x 250 字节
# （5 万 -> 约 12MB）。调小更省内存，调大吞吐略高。
SUB_BATCH = 50000

# ==================== 系统资源保护 ====================
# 实测踩过：扫描把 726MB 的机器榨干，SSH 连上立刻被断开，只能硬重启。
# 根因是内核给每个 socket 默认预留 208KB 收 + 208KB 发缓冲，
# 3000 并发就是 1.2GB 内核内存 —— 远超机器内存，而且不算进进程 RSS，
# 所以 OOM killer 不一定触发，但内核已经分配不出内存给 sshd。
#
# 三道闸：
#   1. socket 缓冲压到 SOCK_BUF_BYTES（默认 16KB，降 13 倍）
#   2. 可用内存低于 SYS_MIN_FREE_MB 就暂停扫描，等系统缓过来
#   3. 并发按【可用内存 + 临时端口 + 内核 socket 表】自动封顶
SYS_GUARD_ENABLED = true
SYS_MIN_FREE_MB = 150 # 可用内存低于这个值就暂停（给 sshd 留活路）
PER_CONN_KB = 64 # 每个并发连接的内核内存预算（KB），按这个算并发上限

# socket 收发缓冲（字节）。只交换几百字节，16KB 足够；内核会翻倍。
SOCK_BUF_BYTES = 16384
SOCK_BUF_ENABLED = true

# ==================== 累积 IP 池 ====================
# 每轮的结果【并进】池子，而不是覆盖输出。
#
# 为什么：这个系统的分工是「上游慢而全地发现、下游快而准地挑」。
# 上游 5~7 天才跑一轮，如果每轮覆盖，那么某一轮赶上网络抖动、被限流、
# 或者只跑了一部分就重启，池子就会【缩水】，下游拿到的反而比上一轮少。
# 累积之后池子只增不减（除非条目太久没再出现），单轮波动不影响下游。
POOL_ENABLED = true
POOL_FILE = "./output/pool.csv"
POOL_MAX_AGE_DAYS = 30 # 超过这么多天没再出现的条目才淘汰

# ==================== 上游模式 ====================
# 上游 VPS 只做「发现」，不做质量筛选。
#   stage1 通过 = 它【确实是】反代（客观事实，跟测量点无关）
#   stage2 通过 = 它【在这台 VPS 上】快、不丢包（主观，跟测量点强相关）
# VPS 在海外机房，测出来的延迟/速度对国内家用网络毫无参考价值，
# 质量排序是下游（家里 NAS）的活。开着这个上游只交回「所有真反代」，
# 顺带省掉测速和线路分析，一轮快 30%+。
UPSTREAM_STAGE1_ONLY = true

# 池子更新方式：
#   auto    全量扫完 -> 替换（差集，死掉的移除）；中途中断 -> 并集
#   replace 永远替换
#   merge   永远并集
# 为什么中断时要并集：全量扫描时「没出现 = 测了且失败」可以做差集；
# 但只扫了一部分时「没出现」可能只是没扫到，做差集会误杀。
POOL_MODE = "auto"
