# ==================== 丢包筛选与排序（24 小时批量优选） ====================
# 丢包比延迟更致命：一次 TLS 握手要几个来回，5% 丢包就会让握手反复重传，
# 体感比 200ms 延迟还差。所以它既是一道淘汰线，也参与最终排序。

# 丢包超过这个百分比直接淘汰
MAX_LOSS_PCT = 30.0

# 排序综合评分 = 延迟 × (1 + 丢包率/100 × LOSS_PENALTY)
#   0% 丢包 → 分数 = 延迟
#  10% 丢包 → 分数 = 延迟 × 1.5
#  30% 丢包 → 分数 = 延迟 × 2.5
# 纯按延迟排会把"40ms 但丢包 25%"排到最前面；纯按丢包排又会把
# "280ms 但零丢包"排到 "30ms 丢包 1%" 前面，都不对，所以用综合评分。
LOSS_PENALTY = 5.0

# 最终只保留排序后的前 N 个（0 = 不限制）。推 DNS 分流用 150~200 个足够。
TOP_N = 200

# 排序模式：
#   "score"   = 按 延迟+丢包 综合评分升序（批量优选推荐）
#   "country" = 原版逻辑：previousCountry 优先，再按速度降序
