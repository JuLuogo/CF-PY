# ==================== ASN 段扫描（-source asn） ====================
# 按服务商 ASN 定向扫网段。段数据来自 RIPE Stat 的公开 BGP 数据（免费无 key）。

# 扫哪些厂商。可以用【档位】、厂商名、或直接写 AS 号，逗号分隔混写。
#
# 档位（推荐用这个，省得一个个列）：
#   vps   55 个 ASN / 约 22 万个 /24 —— 便宜 VPS 集中营，反代绝大多数在这里
#   all   70 个 ASN / 约 204 万个 /24 —— 除大陆外全部厂商（含亚马逊/微软/谷歌）
#   两个档位都已排除中国大陆 ASN。
#
# 厂商名（会自动展开成该厂商【全部】ASN）：
#   alibaba tencent huawei ucloud yunify    中国厂商的【国际】ASN
#   oracle vultr digitalocean linode hetzner ovh contabo scaleway upcloud
#   kamatera ionos netcup leaseweb gcore aeza melbicom frantech hosthatch
#   sharktech psychz multacom colocrossing zenlayer worldstream serverius
#   hostwinds interserver greencloud bandwagon sakura
#   amazon microsoft google softbank kddi ntt akamai softlayer fastly bunny
#   想扫大陆机房（做不了境外反代，一般不用）：alibaba_cn tencent_cn huawei_cn ...
#
# ⚠ 一家厂商往往有多个 ASN，只查一个会漏掉一大半：
#   阿里云 只查 AS45102 → 4.3 万个 /24，实际 12.4 万（漏 2/3）
#   腾讯云 只查 AS132203 → 1.1 万个 /24，实际 6.0 万（漏 5/6）
#
# ⚠ 关于 all 档位：亚马逊一家就占全部候选的 47%（95 万个 /24），
#   微软 16%、谷歌 11% —— 超大规模云合计 87%，但反代很少跑在这些贵机器上。
#   而且 AWS/Azure/GCP 的滥用检测很激进，全量扫容易把 VPS 本身搞进黑名单。
#   24 小时跑的话，vps 档位一轮几分钟，all 档位一轮约 4 小时。
ASNS = "vps"

# 每个 ASN 采样多少个 /24（每个 /24 只取 1 个 IP，因为同 /24 内路由行为一致）。
# 0 = 全量（不采样），这时 ASN_SAMPLE 失效，扫上面全部网段。
ASN_SAMPLE = 200

# 地区过滤：默认是【黑名单】模式 —— 排除大陆，其余全要。
ASN_EXCLUDE_REGIONS = "CN"

# 也可以改成【白名单】模式：只保留指定地区（留空 = 不启用白名单）。
