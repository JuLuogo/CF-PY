# ==================== IPDB 接入（fetch_ips.py 使用，免费免 key） ====================
# 接口：https://ipdb.api.030101.xyz/
# 反代池每 10 分钟刷新一次，比 FOFA 的索引快得多，适合做全自动定时任务。

IPDB_API_BASE = "https://ipdb.api.030101.xyz/"

# 取哪些列表，用 ; 分隔：
#   bestproxy  已优选的反代 IP（每 30 分钟刷新，带地区，数量少质量高）
#   proxy      全量反代 IP 池（每 10 分钟刷新，700+ 条独立 IP）
#   cfv4       Cloudflare 官方网段 —— 按不同 /24 采样 IPDB_CF_SAMPLE 个地址一起测
#   bestcf     已优选的 Cloudflare 官方 IP（不是反代，一般用不上）
#   cfv6       Cloudflare 官方 IPv6 网段；ip.py 只支持 IPv4，会被跳过
#
# 为什么要带 cfv4：只靠第三方反代会失效/被限速，官方 IP 是稳定兜底。
# 注意 cfv4 是网段（15 条 CIDR），全展开是 1,524,736 个地址——绝不能展开。
# 脚本只按「不同 /24」采样 IPDB_CF_SAMPLE 个（每 /24 一个，行为一致的多取无益）。
# 顺序有讲究：小列表在前。IPDB 的 proxy 大列表在国内直连经常读不完
# （实测联通直连 90s 只收到 428/723 行），放最后即使超时也不影响已拿到的数据。
IPDB_TYPES = "bestproxy;cfv4;proxy"

IPDB_COUNTRY = true # 对 bestproxy/bestcf 追加 country=true，拿到 #HK 这类地区标注
IPDB_TIMEOUT = 120 # 国内直连 IPDB 偏慢，给足时间
IPDB_RETRIES = 3
IPDB_MAX = 0 # 只取前 N 个候选，0=不限制（命令行 -max 优先级更高）
# 从 Cloudflare 官方网段采样多少个 IP。建议 10~50，0=不测官方 IP。
IPDB_CF_SAMPLE = 30

