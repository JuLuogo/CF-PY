name: Build and push Docker image

# 推到 GitHub 后这个工作流会自动构建镜像并推到 GitHub Container Registry。
# 之后在 VPS 上 docker compose up -d 就能直接拉取运行。
#
# 镜像地址：ghcr.io/<你的用户名>/<仓库名>:latest
# ⚠ 首次推送后，去 GitHub 仓库的 Packages 页面把包设为 Public，
#   否则 VPS 上拉取需要先 docker login ghcr.io。

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # 允许手动触发
  schedule:
    # 每周一凌晨重建一次，跟上基础镜像的安全更新
    - cron: "0 19 * * 0" # UTC 19:00 周日 = 北京时间周一 03:00

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # PR 只构建不推送，省得把 PR 的镜像也推进 registry
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 + arm64：不少便宜 VPS 是 ARM 的（甲骨文、部分搬瓦工机型）
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
